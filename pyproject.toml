[project]
name = "quant-research-skill"
version = "1.5.2"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyqlib==0.9.7", "numpy==1.26.4", "pandas==2.3.3",
  "scipy==1.17.1", "scikit-learn==1.9.1", "statsmodels==0.15.0",
  "pyarrow==25.0.1", "lightgbm==4.7.0", "xgboost==3.2.0",
  "filelock>=3.16,<4",
  "baostock==0.9.4",
]

[project.optional-dependencies]
models = ["torch==2.15.0"]
reports = ["pypdf==6.21.4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pyyaml>=6,<7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
